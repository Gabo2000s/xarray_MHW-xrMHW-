[build-system]
# >=1.27 is the first hatchling that understands the PEP 639 license fields below.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xrMHW"
version = "3.0.0"
description = "An N-Dimensional Vectorized Python Package for Marine Heatwave Detection"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    {name = "G. S. Gutiérrez-Cárdenas", email = "ggutierrezca@mun.ca"},
    {name = "Frédéric Cyr"},
    {name = "Eric C. J. Oliver"},
    {name = "Nancy Soontiens"},
]
keywords = ["oceanography", "marine heatwaves", "climate science", "xarray", "dask"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS"
]
dependencies = [
    "xarray>=2022.03.0",
    "dask>=2022.01.0",
    "netCDF4>=1.5.8",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "numpy>=1.20.0"
]

[project.urls]
Homepage = "https://github.com/Gabo2000s/xarray_MHW-xrMHW-"
Repository = "https://github.com/Gabo2000s/xarray_MHW-xrMHW-"
Issues = "https://github.com/Gabo2000s/xarray_MHW-xrMHW-/issues"
Archive = "https://doi.org/10.5281/zenodo.18476144"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0"
]
# Everything the notebooks in examples/ use besides xrMHW itself
examples = [
    "pooch>=1.6",
    "matplotlib>=3.5",
    "cartopy>=0.21",
    "cmocean>=2.0",
    "plotly>=5.0",
    "nbformat>=4.2.0",
    "ipykernel",
    "zarr>=2.13",
    "distributed>=2022.01.0",
]

[tool.hatch.build.targets.wheel]
include = ["xrMHW.py"]
