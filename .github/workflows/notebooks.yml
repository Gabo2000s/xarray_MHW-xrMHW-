name: Example notebooks

# Runs every notebook in examples/ from top to bottom and fails if any cell raises.
# The notebooks are stored with their outputs; this job only checks that they still
# run, it does not overwrite them.
on:
  push:
    branches: [ main ]
    paths: [ "examples/**", "xrMHW.py", "pyproject.toml", ".github/workflows/notebooks.yml" ]
  pull_request:
    branches: [ main ]
    paths: [ "examples/**", "xrMHW.py", "pyproject.toml", ".github/workflows/notebooks.yml" ]
  schedule:
    # Monthly, to catch changes in dependencies or in access to the example data
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install xrMHW with the example dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[examples]" nbmake

    # The example data (86 MB from Zenodo) and cartopy's coastlines are downloaded
    # once and reused by later runs.
    - name: Cache downloaded data
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/xrmhw
          ~/.local/share/cartopy
        key: example-data-zenodo-22909109

    - name: Run the notebooks
      working-directory: examples
      run: pytest --nbmake --nbmake-timeout=1500 *.ipynb
