name: Tests

on:
  push:
    branches: [ main ]
  # Every pull request, whatever its target branch
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[test]"

    - name: Run tests with pytest
      run: |
        pytest -rs

  wheel:
    # Guards against the failure mode the flat layout allows: `import xrMHW`
    # succeeds from the repository root whether or not the package is
    # installed, so the suite above can pass while the distributed wheel is
    # broken (for example if the hand-written file list in
    # [tool.hatch.build.targets.wheel] stops matching the sources).
    # This job builds the wheel, installs it into an empty virtual environment
    # and runs the tests from a directory outside the checkout, so the only
    # importable xrMHW is the installed one.
    name: Clean install from built wheel
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Build the wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build --wheel
        ls -l dist/

    - name: Install the wheel into a clean environment
      run: |
        python -m venv "$RUNNER_TEMP/cleanenv"
        "$RUNNER_TEMP/cleanenv/bin/pip" install --upgrade pip
        "$RUNNER_TEMP/cleanenv/bin/pip" install dist/*.whl
        "$RUNNER_TEMP/cleanenv/bin/pip" install pytest pymannkendall cftime

    - name: Verify the import resolves to the installed package
      run: |
        mkdir -p "$RUNNER_TEMP/outside"
        cd "$RUNNER_TEMP/outside"
        "$RUNNER_TEMP/cleanenv/bin/python" - <<'PY'
        import pathlib
        import xrMHW

        origin = pathlib.Path(xrMHW.__file__).resolve()
        print(f"imported xrMHW {xrMHW.__version__} from {origin}")
        assert "site-packages" in origin.parts, (
            f"xrMHW was imported from {origin}, not from the installed wheel"
        )
        for name in xrMHW.__all__:
            assert hasattr(xrMHW, name), f"public API missing from the wheel: {name}"
        PY

    - name: Run the test suite from outside the repository
      run: |
        cp tests/*.py "$RUNNER_TEMP/outside/"
        cd "$RUNNER_TEMP/outside"
        "$RUNNER_TEMP/cleanenv/bin/python" -m pytest -v
